[project]
name = "amc-backend-py"
version = "1.0.0"
description = "Backend for AMC Internal Application (Python / FastAPI port of amc-backend)"
authors = [{ name = "Janine Franken", email = "janine@automoto-sr.info" }]
readme = "README.md"
license = { text = "UNLICENSED" }
requires-python = ">=3.13"

[project.urls]
Homepage = "https://interna.automoto-sr.info"

[project.optional-dependencies]
dev = [
    "ruff==0.16.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
